  const clubs=groups.flatMap(([division,level,names])=>names.map((name,i)=>({id:division+'-'+i,name,division,stars:stars[name]||level,strength:45+(stars[name]||level)*8})));
  const positions=[['GOL','Goleiro'],['ZAG','Zagueiro'],['LAT','Lateral'],['VOL','Volante'],['MEI','Meia'],['PON','Ponta'],['ATA','Atacante']].map(([id,name])=>({id,name}));

})();

  const parse=(s,tier)=>s?s.split('|').map((v,i)=>{const [name,rating]=v.split(':');return {name,strength:+rating||Math.max(45,60-i),tier};}):[];

/* UI depends on this contract. A server can replace LocalCareerService later. */
const LocalCareerService=(()=>{
  let state=CareerEngine.create(Date.now());
  return {
    async snapshot(){const view=JSON.parse(JSON.stringify(state));delete view.seed;delete view.processed;return view;},
    async exportSave(){return JSON.parse(JSON.stringify(state));},
    async execute(command){state=CareerEngine.execute(state,command);return this.snapshot();},
    async restore(data){state=CareerEngine.restore(data);return this.snapshot();},
    async reset(){state=CareerEngine.create(Date.now());return this.snapshot();}
  };
})();

  constructor(baseUrl){this.baseUrl=baseUrl;}

  exportSave(){return this.request('/career/export');}
  restore(data){return this.request('/career/import',{save:data});}
  reset(){return this.request('/career/new',{});}
}

 function statControls(){const records=state.player.matchHistory||[],clubs=[...new Set(records.map(m=>m.clubId))],comps=[...new Map(records.map(m=>[m.compId,m.competition])).entries()];return (statsView==='national'?'':'<label>Clube<select id="statClub"><option value="all">Todos os clubes</option>'+clubs.map(id=>'<option value="'+esc(id)+'" '+(statClub===id?'selected':'')+'>'+esc(team(id)?.name)+'</option>').join('')+'</select></label><label>Competição<select id="statCompetition"><option value="all">Geral</option>'+comps.map(([id,name])=>'<option value="'+esc(id)+'" '+(statCompetition===id?'selected':'')+'>'+esc(name)+'</option>').join('')+'</select></label>');}
 function statTotals(){const p=state.player,total={games:0,minutes:0,goals:0,assists:0,cleanSheets:0,ratingSum:0,yellow:0,red:0},cutoff=state.date.slice(0,4);let records=[];if(statsView!=='national')records.push(...(p.matchHistory||[]).filter(m=>(statClub==='all'||m.clubId===statClub)&&(statCompetition==='all'||m.compId===statCompetition)));if(statsView!=='club')records.push(...state.history.filter(h=>h.type==='Seleção'));for(const h of records.filter(h=>h.minutes&&(statsPeriod==='all'||h.date>=p.evolutionStart&&h.date<p.evolutionEnd))){total.games++;for(const k of ['minutes','goals','assists','yellow','red'])total[k]+=h[k]||0;total.cleanSheets+=+h.cleanSheet;total.ratingSum+=h.rating;}return total;}
 function leaderboard(){if(statsView==='national')return '';const c=statCompetition==='all'?league():state.competitions.find(c=>c.id===statCompetition);if(!c)return '';const labels={goals:'Gols',assists:'Assistências',rating:'Nota média',cards:'Cartões',cleanSheets:'Sem sofrer gols'},rows=c.teams.map(id=>{const own=id===state.player.clubId,stats=c.stats[id],fixtures=state.matches.filter(m=>m.compId===c.id&&m.played&&[m.home,m.away].includes(id)),gf=fixtures.reduce((n,m)=>n+m.score[m.home===id?0:1],0),cs=fixtures.filter(m=>m.score[m.home===id?1:0]===0).length;return {id,own,value:own&&stats?statMetric==='rating'?stats.ratingSum/Math.max(1,stats.games):statMetric==='cards'?stats.yellow+stats.red:stats[statMetric]||0:statMetric==='goals'?Math.floor(gf*.4):statMetric==='assists'?Math.floor(gf*.25):statMetric==='cleanSheets'?cs:statMetric==='cards'?Math.floor(fixtures.length*.18):6.4+Math.min(1.8,gf/Math.max(1,fixtures.length)*.35)};}).sort((a,b)=>b.value-a.value);return card('Destaques · '+c.name,'<label>Dado<select id="statMetric">'+Object.entries(labels).filter(([id])=>id!=='cleanSheets'||['GOL','ZAG','LAT','VOL'].includes(state.player.position)).map(([id,label])=>'<option value="'+id+'" '+(id===statMetric?'selected':'')+'>'+label+'</option>').join('')+'</select></label><small>Adversários representados por jogadores fictícios. Estatísticas dos destaques externos são estimadas a partir dos resultados dos clubes nesta beta.</small>'+rows.slice(0,10).map((r,i)=>'<div class="spread ledger '+(r.own?'mine':'')+'"><span>'+(i+1)+' · '+esc(r.own?state.player.name:'JOGADOR')+' — '+esc(team(r.id).name)+'</span><b>'+(statMetric==='rating'?Math.floor(r.value):r.value)+'</b></div>').join(''));}
 function stats(){const p=state.player;let out='<h2>Estatísticas</h2><div class="segments">'+[['club','Clubes'],['national','Seleção'],['all','Geral']].map(([v,t])=>b(t,'statsView',{value:v},statsView===v?'selected':'')).join('')+'</div><label>Período<select id="statsPeriod"><option value="all" '+(statsPeriod==='all'?'selected':'')+'>Carreira inteira</option><option value="year" '+(statsPeriod==='year'?'selected':'')+'>Temporada atual</option></select></label><div class="segments">'+[['numbers','Números'],['titles','Títulos'],['awards','Prêmios']].map(([v,t])=>b(t,'statsKind',{value:v},statsKind===v?'selected':'')).join('')+'</div>';out+=statControls();if(statsKind==='numbers'){const t=statTotals(),items=[['Partidas',t.games],['Minutos',t.minutes],['Gols',t.goals],['Assistências',t.assists],['Nota média',t.games?Math.floor((t.ratingSum/t.games)):'—'],['Cartões',t.yellow+' A / '+t.red+' V']];if(['GOL','ZAG','LAT','VOL'].includes(p.position))items.push(['Sem sofrer gols',t.cleanSheets]);out+=tiles(items)+leaderboard();const comps=state.competitions.filter(c=>c.stats[p.clubId]);out+=card('Por competição',comps.map(c=>{const t=c.stats[p.clubId];return '<div class="list-row"><b>'+esc(c.name)+'</b><small>'+t.games+' jogos · '+t.goals+' gols · '+t.assists+' assist. · nota '+Math.floor((t.ratingSum/Math.max(1,t.games)))+'</small></div>';}).join('')||'<p>Ainda não há atuações.</p>');}else{const list=statsKind==='titles'?p.titles:p.awards;out+=list.filter(t=>statsView==='all'||statsView==='national'===!!t.national).map(t=>card('🏆 '+t.name,'<p>'+esc(t.year||t.age+' anos')+' · '+(t.youth?'Base':t.national?'Seleção':'Clube')+'</p>')).join('')||card('Sua sala de conquistas','<p>As conquistas aparecerão aqui ao longo da carreira.</p>');}out+=card('Demonstrativo de evolução',state.seasonReports.map(r=>'<div class="list-row"><b>'+r.year+' · overall final '+r.overall+'</b><small>Clube +'+Math.floor(r.gain)+' / −'+Math.floor(r.loss)+' · seleção +'+r.national+' · lesões −'+r.injuryLoss+' · livre −'+r.freeLoss+'</small></div>').join('')||'<p>Disponível após o primeiro ano profissional.</p>');return out;}
 function ledgerHTML(){const l=state.player.ledger;if(!l)return '<p>Sem demonstrativo.</p>';return '<small>'+humanDate(l.start)+' — '+humanDate(l.end)+'</small>'+[['Salário',l.gross],['Custo de vida · 30%',-l.life],['Gastos profissionais',-l.services],['Empresário',-l.agent],['Multa de rescisão',-l.fine]].filter(([,v],i)=>v||i===0).map(([t,v])=>'<div class="spread ledger"><span>'+t+'</span><b>'+money(v)+'</b></div>').join('')+'<div class="spread total"><b>Saldo líquido</b><b>'+money(CareerEngine.net(state.player))+'</b></div>'+(l.increase?'<p>Diferença de aumento recebida: '+money(l.increase)+'</p>':'');}
 function office(){const p=state.player,g=CareerEngine.greatness(state),removedAgent=null;let out='<h2>Escritório</h2>'+tiles([['Fama',Math.floor(clamp((p.overall-40)*1.3+(CareerEngine.effective(p)-p.overall)*0+(p.form.length?formLocal(p)-6.5:0)*12,0,100))+'%'],['Grandeza · 12 meses',g+' / 100'],['Salários acumulados',money(p.earnings)],['Saldo disponível',money(p.balance)]]);out+=card('Gasto anual · demonstrativo',ledgerHTML()+(state.budgetPending?'<p>Selecione os serviços e confirme. Se faltar dinheiro, dispense serviços até o saldo ficar positivo.</p>'+b('Confirmar orçamento e continuar','confirmBudget',{},'primary'):'<small>Valores já quitados neste período.</small>'));

  if(p.clubId&&!p.loan)out+=card('Conversar com o clube','<div class="segments">'+b('Pedir aumento salarial','request',{kind:'salary'})+b('Pedir mais minutos','request',{kind:'minutes'})+'</div><small>Intervalo de 6 meses por pedido. O clube responde imediatamente.</small>');if(p.clubId)out+=card('Número da camisa','<b>Atual: #'+p.shirt+'</b><label>Número desejado<input id="shirtNumber" type="number" min="1" max="99" value="'+p.shirt+'"></label>'+b('Solicitar troca','changeShirt')+'<small>Disponíveis: 12, 16, 21, 24, 27, 30. Números 1, 7, 9, 10 e 11 dependem da aprovação do clube. Somente nas janelas.</small>');return out;}
 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),formLocal=p=>p.form.reduce((n,m)=>n+m.rating,0)/Math.max(1,p.form.length);
 function options(){return '<h2>Opções</h2>'+card('Simulação','<div class="segments">'+[['fast','Rápida'],['slow','Lenta'],['instant','Instantânea']].map(([v,t])=>b(t,'settings',{speed:v},state.settings.speed===v?'selected':'')).join('')+'</div><small>A velocidade muda a apresentação, não os resultados.</small>')+card('Cor','<div class="colors">'+[['blue','Azul'],['green','Verde'],['yellow','Amarelo'],['red','Vermelho'],['club','Cor do clube']].map(([v,t])=>b(t,'settings',{color:v},state.settings.color===v?'selected':'')).join('')+'</div>')+card('Claridade','<div class="segments">'+b('Dia','settings',{light:'day'},state.settings.light==='day'?'selected':'')+b('Noite','settings',{light:'night'},state.settings.light==='night'?'selected':'')+'</div>')+card('Salvamento','<label>Automático<select id="savePolicy">'+[['match','Após cada ação / partida'],['month','Após cada mês'],['year','Após cada temporada'],['manual','Somente manual']].map(([v,t])=>'<option value="'+v+'" '+(state.settings.save===v?'selected':'')+'>'+t+'</option>').join('')+'</select></label>'+b('Salvar agora','save',{},'primary')+'<small>Último save: '+esc(localStorage.getItem(key+'-time')?new Date(localStorage.getItem(key+'-time')).toLocaleString('pt-BR'):'nenhum')+'</small><div class="segments">'+b('Exportar backup','export')+b('Importar backup','import')+'</div>'+b('Compartilhar carreira','share')+b('Voltar ao menu','new')+b('Aposentar jogador','retire',{},'danger'))+card('Sobre esta beta','<p>41 países. Novas ligas com referência 2026 ou 2026/27; Senegal usa base provisória. Forças e salários são estimativas do jogo. Calendários, fases e critérios de descenso simplificados; não são regulamentos oficiais completos. Divisões inferiores novas servem só como reservas de acesso. Rússia: liga e copa nacional. Câmbio fixo; save local comprimido.</p>');}
 function render(){if(!state)return;header();const p=state.player;let html='';if(state.phase==='setup')html='<div class="hero"><small>DA BASE AO PROFISSIONAL</small><h2>O próximo ídolo<br>tem o seu nome.</h2><p>Entre em campo. Conquiste seu espaço. Escreva sua carreira.</p><div class="hero-pitch" aria-hidden="true"><div class="pitch-circle"></div><span class="pitch-player">10</span><span class="pitch-caption">CARREIRA • FUTEBOL • LEGADO</span></div></div><label>Nome<input id="name" maxlength="24" placeholder="Seu nome"></label><label>Posição<select id="position">'+CareerData.positions.map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join('')+'</select></label>'+b('Começar na base','create',{},'primary')+b('Continuar carreira salva','load');else if(state.phase==='club')html='<h2>Seu primeiro clube</h2><p>Oportunidades na base brasileira.</p>'+state.choices.map(id=>b(team(id).name+' · '+(team(id).level||CareerData.clubLevel(team(id))),'chooseClub',{clubId:id},'choice')).join('');else if(state.phase==='youth'){const y=state.youthHistory.at(-1);html='<h2>Base · '+p.age+' anos</h2>'+tiles([['Jogos',y.games],['Gols',y.goals],['Assistências',y.assists],['Nota',y.rating],['Overall',p.overall],['Evolução no ano','+'+(y.gain??'—')],['Sem sofrer gols',y.cleanSheets??'—'],['Destaques',y.mvp??'—']])+card('Conquistas',esc(y.titles.join(' · ')||'Sem títulos neste ano.'))+'<h3>Ofertas de profissionalização</h3>'+state.offers.map(offerHTML).join('')+(p.age===22?'<p class="warning">Último ano na base. Ao completar 23 sem profissionalização, a carreira termina.</p>':'')+b(p.age===22?'Encerrar sem profissionalizar':'Jogar mais um ano na base','youthNext');}else if(state.phase==='retired')html='<h2>Carreira encerrada</h2>'+tiles([['Pico de overall',p.peak],['Partidas',p.totals.games+p.national.games],['Salários acumulados',money(p.earnings)],['Títulos',p.titles.length]])+b('Exportar história','export')+b('Nova carreira','new');else if(p.nationalDuty)html=nationalScreen();else html={panel,tournaments,training,market,stats,office,options}[screen]();$('view').innerHTML=html;bindContent();}
 function bindContent(){if($('tournamentFilter'))$('tournamentFilter').onchange=e=>{tournamentId=e.target.value;render();};
  if($('statClub'))$('statClub').onchange=e=>{statClub=e.target.value;render();};
  if($('statCompetition'))$('statCompetition').onchange=e=>{statCompetition=e.target.value;render();};
  if($('statMetric'))$('statMetric').onchange=e=>{statMetric=e.target.value;render();};
  document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>act(el.dataset.action,JSON.parse(el.dataset.payload||'{}')));
  document.querySelectorAll('[data-service]').forEach(el=>el.onchange=()=>command('services',{ids:Array.from(document.querySelectorAll('[data-service]')).filter(x=>x.checked).map(x=>+x.dataset.service)}));

 }
 async function act(action,x={}){if(action==='nationalNormal')return command('nationalNext');if(action==='nationalQuick')return command('nationalNext',{quick:true});if(action==='seasonReport'){popup('Fim da temporada',reportHTML(state.seasonReports[0]));return;}if(action==='navigate'){screen=x.screen;render();return;}if(action==='create')return command('start',{name:$('name').value,position:$('position').value});if(action==='statsView'){statsView=x.value;render();return;}if(action==='statsKind'){statsKind=x.value;render();return;}if(action==='tableMode'){tableMode=x.mode;render();return;}if(action==='save')return save();if(action==='changeShirt')return command('shirt',{number:+$('shirtNumber').value});if(action==='load'){try{const value=localStorage.getItem(key);if(!value)throw Error('Nenhuma carreira salva.');state=await svc.restore(await CareerSaveCodec.decode(value));screen='panel';dirty=false;render();note('Carreira carregada.');}catch(e){note(e.message);}return;}if(action==='export'){const data=await svc.exportSave(),url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='pcarrer-carreira-mensal.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;}if(action==='import'){$('importFile').click();return;}if(action==='share'){const p=state.player,text=`Minha carreira no PCARRER: ${p.name}, ${p.age} anos, OVR ${p.overall}, ${p.clubId?team(p.clubId).name:'sem clube'}. ${p.totals.games} jogos, ${p.totals.goals} gols, ${p.titles.length} títulos.`;try{if(navigator.share)await navigator.share({title:'Minha carreira',text});else{await navigator.clipboard.writeText(text);note('Resumo copiado para compartilhar.');}}catch(e){if(e.name!=='AbortError')note(text);}return;}if(action==='new'){if(dirty&&!confirm('Há alterações sem salvar. Voltar ao menu?'))return;state=await svc.reset();screen='panel';render();return;}if(action==='retire'&&!confirm('Encerrar definitivamente esta carreira?'))return;if(action==='youthNext'&&state.player.age===22&&!confirm('Encerrar sem aceitar uma oferta profissional?'))return;if(action==='acceptOffer'&&!confirm('Assinar esta proposta? Após assinar, não será possível desistir.'))return;return command(action,x);}
 function matchResult(m){const st=m.playerStats;return '<h3>PLACAR FINAL · '+m.score.join(' × ')+'</h3>'+(m.aggregate?'<p>Agregado: '+m.aggregate.join(' × ')+'</p>':'')+(m.penalties?'<p>Pênaltis: '+m.penalties+'</p>':'')+tiles([['Minutos',st.minutes],['Nota',st.rating??'—'],['Gols',st.goals],['Assistências',st.assists],['MVP',st.mvp?'Sim':'Não'],['Clean sheet',st.cleanSheet?'Sim':'Não'],['Defesas',st.saves||0],['Desarmes',st.tackles||0]])+(!st.minutes?'<p>'+esc(st.reason||'Reserva não utilizado')+'</p>':'');}
 function replayScore(m,minute){return m.events.filter(e=>e.scoring&&e.minute<=minute).reduce((score,e)=>{score[e.side]++;return score;},[0,0]);}
 function showMatchResult(){clearInterval(replayTimer);replay.finished=true;$('replayMinute').textContent='FIM';$('replayScore').textContent=replay.score.join(' × ');$('replayBody').innerHTML=matchResult(replay);$('replaySkip').hidden=true;$('replayClose').hidden=false;$('replayClose').textContent='Voltar ao painel';}
 function startReplay(m,quick=false){replay={...m,finished:false};const st=m.playerStats;let minute=st.entry||0;const pace=state.settings.speed==='slow'?500:130;$('replay').hidden=false;$('replayTeams').textContent=(team(m.home)?.name||m.home)+' × '+(team(m.away)?.name||m.away);$('replayCompetition').textContent=matchLabel(m);$('replayBody').innerHTML='';$('replaySkip').hidden=false;$('replayClose').hidden=true;$('replayClose').textContent='VER RESULTADO FINAL';if(quick){showMatchResult();return;}
  const tick=()=>{$('replayMinute').textContent=minute+'′';$('replayScore').textContent=replayScore(m,minute).join(' × ');for(const e of m.events.filter(e=>e.minute===minute)){const line=document.createElement('p');line.className='replay-event '+(e.kind||'play');line.textContent=e.minute+'′ · '+e.text;$('replayBody').appendChild(line);$('replayBody').scrollTop=$('replayBody').scrollHeight;}if(minute>=st.exit){clearInterval(replayTimer);$('replaySkip').hidden=true;if(st.exit>=90)showMatchResult();else{$('replayClose').hidden=false;$('replayClose').textContent='VER RESULTADO FINAL';}return;}minute++;};tick();if(minute<=st.exit&&!replay.finished)replayTimer=setInterval(tick,pace);}
 $('replaySkip').onclick=showMatchResult;$('replayClose').onclick=()=>{if(!replay.finished){showMatchResult();return;}clearInterval(replayTimer);replay=null;$('replay').hidden=true;render();};
 document.querySelectorAll('[data-screen]').forEach(el=>el.onclick=()=>{if(replay)return;screen=el.dataset.screen;render();$('content').scrollTop=0;});
 $('resolvePending').onclick=()=>{screen=state.budgetPending?'office':'market';render();$('content').scrollTop=0;};
 $('playNext').onclick=()=>command('playNext');$('quickMatch').onclick=()=>command('playNext',{quick:true});$('newGame').onclick=()=>act('new');
 $('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>50*1024*1024)throw Error('Backup muito grande.');const value=JSON.parse(await f.text());state=await svc.restore(CareerSaveCodec.unpack(value));screen='panel';render();note('Backup restaurado.');}catch(error){note('Falha ao importar: '+error.message);}finally{e.target.value='';}};
 window.addEventListener('beforeunload',e=>{if(dirty&&state.settings.save==='manual'){e.preventDefault();e.returnValue='';}});svc.snapshot().then(s=>{state=s;render();});
})();



</script></body></html>
